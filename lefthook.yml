# lefthook.yml — Pre-push quality gate (<400ms)
#
# Install:
#   brew install lefthook && lefthook install
#
# What it checks:
#   - TypeScript 7 type checking (repository-wide when TS changes)
#   - Biome formatting + lint (changed supported files only)
#
# Why pre-push and not pre-commit:
#   - Developers can commit freely (WIP, messy, whatever)
#   - Gate only fires when code leaves the machine
#   - Catches the #1 and #2 CI failure causes: type errors + lint

pre-push:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx,js,jsx}"
      run: bun run type:check
    check:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,json,jsonc,css,scss}"
      run: bun run check:files -- {push_files}
    manifest-sync:
      glob: "{skill-manifest.json,.claude/settings.json,hooks/hooks.json,shared/hook-lib.sh,.claude/hooks/_hook-lib.sh}"
      run: bash scripts/generate-hook-configs.sh --check
    catalog-sync:
      glob: "{*/SKILL.md,.claude-plugin/plugin.json,.codex-plugin/plugin.json,codex-skills/*}"
      run: bash scripts/generate-skill-catalog.sh --check
    rules-sync:
      glob: "{CLAUDE.md,AGENTS.md,.agents/codex-appendix.md,scripts/generate-agents-md.sh}"
      run: bash scripts/generate-agents-md.sh --check
