name: evals

# Deterministic harness gates -- pure bash/jq/perl, zero LLM calls, zero
# secrets. Pull requests run the comprehensive suite on Linux and a focused
# portability suite under macOS's Bash 3.2 and BSD utilities. Shell/hook
# changes and nightly/manual runs retain the full macOS safety net.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select macOS coverage
        if: runner.os == 'macOS'
        id: macos-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          full=false

          case "$EVENT_NAME" in
            schedule|workflow_dispatch) full=true ;;
          esac

          if [ "$full" = false ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || \
              ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || \
              ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              full=true
            elif changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA") && \
              printf '%s\n' "$changed_files" | \
              grep -E '(^|/)[^/]+\.sh$|^\.claude/hooks/|^shared/|^agent-evals/|^evals/|^\.github/workflows/evals\.yml$' >/dev/null; then
              full=true
            fi
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full macOS suite: $full"

      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          perl --version | head -2 | tail -1

      - name: Shellcheck (error severity)
        # -S error only: the surface is bash 3.2-compatible hand-rolled
        # shell; style/info findings would drown the signal. Errors are
        # the parse-level bug class (quoting, redirection, syntax) that
        # has shipped real breakage before. -s bash covers the sourced
        # eval files that carry no shebang by design. Ubuntu runner has
        # shellcheck preinstalled; macOS skips (same files, no per-OS
        # divergence).
        if: runner.os == 'Linux'
        run: |
          shellcheck --version | head -2
          shellcheck -s bash -S error .claude/hooks/*.sh .claude/hooks/checks/*.lib.sh \
            shared/*.sh scripts/*.sh agent-evals/*.sh evals/*.sh \
            frontend-starter-kit/references/*/scripts/*.sh

      - name: Generation gates (hooks, catalog, rules)
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        run: |
          bash scripts/generate-hook-configs.sh --check
          bash scripts/generate-skill-catalog.sh --check
          bash scripts/generate-agents-md.sh --check

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Repository quality gate
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        run: bun run quality:gate

      - name: Translation freshness
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        run: bun run docs:translate:check

      - name: Typed protocol tests
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        run: bun run test

      - name: Install Codex CLI for plugin integration
        run: |
          bun add --global @openai/codex@0.146.0
          codex --version

      - name: Install Claude Code for plugin integration
        run: |
          bun add --global @anthropic-ai/claude-code@2.1.220
          claude --version

      - name: Shell eval suite
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        env:
          CLAUDE_PLUGIN_INSTALL_REQUIRED: "1"
          CODEX_PLUGIN_INSTALL_REQUIRED: "1"
        run: bash evals/run.sh

      - name: Behavioral hook unit tests
        if: runner.os == 'Linux' || steps.macos-scope.outputs.full == 'true'
        run: bash agent-evals/hook-unit-tests-all.sh

      - name: macOS portability suite
        if: runner.os == 'macOS' && steps.macos-scope.outputs.full != 'true'
        run: /bin/bash scripts/run-macos-portability-ci.sh
