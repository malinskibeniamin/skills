syntax = "proto3";

package library.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

message Book {
  option (google.api.resource) = {
    type: "library.example.com/Book"
    pattern: "publishers/{publisher}/books/{book}"
    singular: "book"
    plural: "books"
  };

  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];
  string etag = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 ttl_seconds = 4 [(google.api.field_behavior) = OPTIONAL];
  string software_version = 5 [(google.api.field_behavior) = OPTIONAL];
  string revision_alias = 6 [(google.api.field_behavior) = OPTIONAL];
}

service LibraryService {
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=publishers/*}/books"
    };
  }

  rpc CreateBook(CreateBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{parent=publishers/*}/books"
      body: "book"
    };
  }

  rpc UpdateBook(UpdateBookRequest) returns (Book) {
    option (google.api.http) = {
      patch: "/v1/{book.name=publishers/*/books/*}"
      body: "book"
    };
  }
}

message ListBooksRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListBooksResponse {
  repeated Book books = 1;
}

message CreateBookRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  Book book = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateBookRequest {
  Book book = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = REQUIRED];
}

service EventIngressService {
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse) {
    option (google.api.http) = {
      post: "/v1/events:publish"
      body: "*"
    };
  }
}

message PublishEventRequest {
  bytes payload = 1 [(google.api.field_behavior) = REQUIRED];
}

message PublishEventResponse {}
