<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recording canary</title>
  <style>
    body { margin: 0; background: #e2e8f0; color: #0f172a; font: 24px monospace; }
    header { background: #2563eb; color: white; padding: 28px 48px; }
    main { margin: 44px auto; padding: 32px; width: 840px; background: white; border: 4px solid #64748b; }
    h1 { margin-top: 0; }
    label { display: block; margin: 24px 0 12px; }
    input[type=text] { padding: 14px; width: 500px; font: inherit; border: 2px solid #64748b; }
    input[type=checkbox] { width: 24px; height: 24px; }
    button { padding: 14px 28px; background: #0f172a; color: white; font: inherit; border: 0; cursor: pointer; }
    :focus-visible { outline: 4px solid #2563eb; }
    [role=status] { color: #166534; }
    [role=alert] { color: #b91c1c; }
  </style>
  <header>Browser recording fixture · No product data</header>
  <main>
    <h1>Save a demo task</h1>
    <form>
      <label for="name">Task name</label>
      <input id="name" type="text" required autocomplete="off" />
      <button type="submit">Save task</button>
      <label><input id="fail" type="checkbox" /> Simulate unavailable service</label>
    </form>
    <p role="status"></p>
    <p role="alert"></p>
  </main>
  <script>
    const form = document.querySelector("form");
    const name = document.querySelector("#name");
    const fail = document.querySelector("#fail");
    const status = document.querySelector("[role=status]");
    const error = document.querySelector("[role=alert]");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Saving…";
      error.textContent = "";
      try {
        const response = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fail: fail.checked }),
        });
        if (!response.ok) throw new Error("Service unavailable. Try again.");
        status.textContent = `Saved: ${name.value}`;
      } catch (cause) {
        status.textContent = "";
        error.textContent = cause instanceof Error ? cause.message : "Save failed.";
      }
    });
  </script>
</html>
