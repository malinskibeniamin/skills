<!doctype html>
<!-- HyperFrames composition filled by scripts/pr-video.sh compose. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=880" />
    <title>Before and after</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: #f8fafc; font-family: system-ui, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #title { position: absolute; left: 40px; right: 40px; top: 36px; font-size: 44px; font-weight: 650; }
      .panel { position: absolute; top: 190px; width: 900px; height: 506px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 2px #1f2937; }
      .panel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
      .left { left: 40px; }
      .right { left: 980px; }
      .chip { position: absolute; top: 124px; padding: 8px 20px; border-radius: 999px; font-size: 28px; font-weight: 700; }
      #before-chip { left: 40px; background: #475569; }
      #after-chip { left: 980px; background: #2563eb; }
      .caption { position: absolute; top: 720px; width: 900px; height: 96px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #111827; font-size: 36px; font-weight: 600; }
      .caption span { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="880" data-duration="__DURATION__">
      <div id="title">__TITLE__</div>
      <div id="before-chip" class="chip">Before</div>
      <div id="after-chip" class="chip">After</div>
      <div class="panel left">
        <video id="before-video" src="assets/before.mp4" data-start="0" data-duration="__DURATION__" muted playsinline></video>
      </div>
      <div class="panel right">
        <video id="after-video" src="assets/after.mp4" data-start="0" data-duration="__DURATION__" muted playsinline></video>
      </div>
      <!-- __CAPTIONS__ -->
    </div>
    <script type="application/json" id="caption-tweens">"__TWEENS__"</script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, 0);
      for (const [id, at] of JSON.parse(document.getElementById("caption-tweens").textContent)) {
        tl.fromTo(id, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, at);
      }
      window.__timelines.main = tl;
    </script>
  </body>
</html>
